name: Check the release package
description: Build, package and exercise the unpacked Chrome extension.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
    - shell: bash
      run: |
        set -euo pipefail
        npm ci
        npm run lint
        npm run typecheck
        npm test
        npm run package
        npx playwright install --with-deps chromium
        version=$(node -p "require('./package.json').version")
        unzip -q "release/toolpeek-v${version}.zip" -d "$RUNNER_TEMP/toolpeek"
        TOOLPEEK_EXTENSION_DIR="$RUNNER_TEMP/toolpeek" npm run e2e

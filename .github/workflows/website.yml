name: Website
on:
  push:
    branches: ['**']
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NG_CLI_ANALYTICS: 'false'
      - name: Validate production output
        run: |
          set -euo pipefail
          out=dist/website/browser
          for f in index.html og.png robots.txt sitemap.xml favicon.svg; do test -s "$out/$f"; done
          grep -q '<link rel="canonical" href="https://toolpeek.web.app/"' "$out/index.html"
          grep -q 'og:image' "$out/index.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: website/dist/website/browser
          retention-days: 7

  # Deploys to https://toolpeek.web.app from the default branch only.
  # Requires the FIREBASE_SERVICE_ACCOUNT_TOOLPEEK repository secret (see README).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://toolpeek.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: website/dist/website/browser
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOOLPEEK }}
          projectId: toolpeek
          channelId: live
          entryPoint: website

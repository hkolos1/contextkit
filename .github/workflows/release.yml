name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lints, tests, packages the versioned ZIP and runs the browser suite against it.
      - uses: ./.github/actions/check-extension
      # Creates (or refreshes) a draft release. A maintainer reviews and publishes it.
      - name: Attach the verified ZIP to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset="release/toolpeek-${tag}.zip"
          notes="docs/releases/$tag.md"
          test -s "$notes"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft"; then
            if [ "$(cat "$RUNNER_TEMP/draft")" != "true" ]; then
              echo "::error::$tag is already published; refusing to replace its asset."
              exit 1
            fi
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "Toolpeek $tag" --notes-file "$notes"
          else
            gh release create "$tag" "$asset" --draft --verify-tag --title "Toolpeek $tag" --notes-file "$notes"
          fi

name: Publish ContextKit
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-extension
      - name: Publish verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          name="contextkit-${tag}.zip"
          asset="release/$name"
          notes="docs/releases/$tag.md"
          test -s "$notes"
          if gh release view "$tag" --json assets,isDraft > "$RUNNER_TEMP/release.json"; then
            if jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null; then
              gh release upload "$tag" "$asset" --clobber
              gh release edit "$tag" --title "ContextKit $tag" --notes-file "$notes" --draft=false
            else
              digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
              jq -e --arg name "$name" --arg digest "$digest" \
                'any(.assets[]; .name == $name and .digest == $digest)' "$RUNNER_TEMP/release.json"
            fi
          else
            gh release create "$tag" "$asset" --verify-tag --title "ContextKit $tag" --notes-file "$notes"
          fi
